name:

on:
  push:
    branches:
      - main
      - next
  pull_request:

env:
  HUSKY: 0

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set node.js version
        uses: actions/setup-node@v3
        with:
          node-version-file: '.tool-versions'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install JS Deps
        run: yarn install --frozen-lockfile
        
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        id: setSHAs
        uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t lint test typecheck --head $NX_HEAD --base $NX_BASE
      
      - run: yarn build --parallel 3 --exclude=react-sandbox --head $NX_HEAD --base $NX_BASE

      - name: Release
        if: ${{ success() && (github.event_name != 'pull_request' || (github.event.action == 'closed' && github.event.pull_request.merged == true) || github.ref == 'refs/heads/next') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx nx affected --target release --head $NX_HEAD --base $NX_BASE
